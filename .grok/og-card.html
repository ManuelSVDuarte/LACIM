<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Fraunces;
        src: url("file:///workspace/.grok/fonts/Fraunces-opsz.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: Outfit;
        src: url("file:///workspace/.grok/fonts/Outfit-wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        overflow: hidden;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 612px 1fr;
        background: #ffffff;
        position: relative;
      }
      .rail {
        position: absolute;
        inset: 0 auto 0 0;
        width: 18px;
        background: #0e6b56;
      }
      .gold {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 18px;
        width: 6px;
        background: #c6a04a;
      }
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 8px 28px 40px;
      }
      .mark img {
        height: 548px;
        width: auto;
        display: block;
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 52px 64px 52px 12px;
      }
      .eyebrow {
        font-family: Outfit, sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #0e6b56;
      }
      h1 {
        margin: 16px 0 0;
        font-family: Fraunces, Georgia, serif;
        font-weight: 560;
        font-size: 58px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: #1a2332;
      }
      .rule {
        width: 88px;
        height: 5px;
        border-radius: 99px;
        background: #c6a04a;
        margin: 26px 0 22px;
      }
      .tag {
        margin: 0;
        font-family: Outfit, sans-serif;
        font-weight: 500;
        font-size: 26px;
        line-height: 1.3;
        color: #1a2332;
        max-width: 460px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rail"></div>
      <div class="gold"></div>
      <div class="mark">
        <img src="file:///workspace/.grok/logo-mark.png" alt="" />
      </div>
      <div class="copy">
        <h1>Liga Acadêmica<br />de Cirurgia<br />de Maricá</h1>
        <div class="rule"></div>
        <p class="tag">Técnica, conduta e instrumentação cirúrgica.</p>
      </div>
    </div>
  </body>
</html>
